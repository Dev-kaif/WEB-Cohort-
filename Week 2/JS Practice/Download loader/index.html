<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: sans-serif;
        }
        
        html,body {
          height:100%;
          width:100%;
          background-color: black;
        }

        #center{
            color: white;
            background-color: rgb(46, 42, 42);
            padding: 1.2vw 3vw;
            border-radius: 20%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
        }
        #downloadcapsule{
            width: 300px;
            height: 20px;
        }

        #progress{
            width: 0%;
            height: 100%;
            border-radius: 100px;
            background-color: aqua;
            transition: all cubic-bezier(0.19, 1, 0.22, 1) 0.2s;
        }


    </style>
</head>
<body>
    <div id="center">
        <h3>Downloading...</h3>
        <div id="downloadcapsule">
            <div id="progress"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
