<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: sans-serif;
        }
        
        html,body {
          height:100%;
          width:100%;
          background-color: black;
        }

        .container{
            padding: 10vw 25vw;
            color: white;
        }
        
        input{
            width: 100%;
            padding: 12px 22px;
            font-size: 30px;
            font-weight: 500;
            color: white;
            border-radius: 10px;
            border: 2px solid white;
            background-color: rgb(105, 105, 105);
            outline-color: yellow;
        }

        .people{
            display: flex;
            gap: 20px;
            margin-top: 4vh;
            flex-wrap: wrap;
            justify-content: center;
        }
        .person{
            display: flex;
            flex-direction: column;
            justify-content: start;
            align-items: center;
            width: fit-content;
        }

        .img{
            width: 7vw;
            height: 7vw;
            border-radius: 50%;
            background-color: red;
            border: 2px solid white;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .img img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="container">
            <input type="text" placeholder="Search">
            <div class="people">
            </div>
        </div>
        
    </div>
    <script src="script.js"></script>
</body>
</html>
