<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.8/axios.min.js"
      integrity="sha512-v8+bPcpk4Sj7CKB11+gK/FnsbgQ15jTwZamnBf/xDmiQDcgOIYufBo6Acu1y30vrk8gg5su4x0CG3zfPaq5Fcg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <style>
      body {
        background-color: #1e1e2e;
        color: #ffffff;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }

      .card {
        width: 120px;
        height: 120px;
        background-color: #2b2b40;
        display: flex;
        justify-content: center;
        align-items: center;
        border: 2px solid #3f3f57;
        border-radius: 12px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        text-align: center;
      }

      .output-box {
        width: 300px;
        height: 60px;
        background-color: #2b2b40;
        border: 2px solid #3f3f57;
        border-radius: 12px;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
        color: #cdd6f4;
      }

      .flex-row {
        display: flex;
        justify-content: space-around;
        gap: 15px;
        margin-top: 40px;
      }

      .label {
        color: #cdd6f4;
        font-size: 16px;
      }

      #output {
        color: #f8d49d;
        font-size: 20px;
        font-weight: bold;
        
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="flex-row">
        <div class="card">
          <p id="va1"></p>
        </div>
        <div class="card">
          <p id="operation"></p>
        </div>
        <div class="card">
          <p id="va2"></p>
        </div>
      </div>
      <div class="output-box">
        <span class="label">Output: </span>
        <span id="output"></span>
      </div>
    </div>

    <script>
      async function calc() {
        try {
          const response = await axios.get("http://localhost:3000/multiply?a=2&b=3");
          console.log(response.data);
          document.getElementById("va1").innerText = response.data.a;
          document.getElementById("va2").innerText = response.data.b;
          document.getElementById("operation").innerText = response.data.operation;
          document.getElementById("output").innerText = response.data.output;
        } catch (error) {
          console.error("Error fetching data:", error);
        }
      }
      calc();
    </script>
  </body>
</html>
