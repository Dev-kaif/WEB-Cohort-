<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.8/axios.min.js"
      integrity="sha512-v8+bPcpk4Sj7CKB11+gK/FnsbgQ15jTwZamnBf/xDmiQDcgOIYufBo6Acu1y30vrk8gg5su4x0CG3zfPaq5Fcg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #121212;
        color: #e0e0e0;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10vw;
      }

      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
      }

      .form-container {
        background-color: #1f1f1f;
        padding: 20px;
        border-radius: 10px;
        width: 300px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        margin-bottom: 20px;
      }

      h1 {
        text-align: center;
        color: #ffffff;
        margin-bottom: 20px;
      }

      .input-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-size: 14px;
        color: #b0b0b0;
        margin-bottom: 5px;
      }

      input {
        width: 100%;
        padding: 10px;
        border: 1px solid #444;
        border-radius: 5px;
        background-color: #333;
        color: #e0e0e0;
      }

      input:focus {
        border-color: #4a90e2;
        outline: none;
      }

      button {
        width: 100%;
        padding: 10px;
        background-color: #4a90e2;
        border: none;
        border-radius: 5px;
        color: #fff;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #357abd;
      }

      footer-text {
        text-align: center;
        font-size: 14px;
        color: #b0b0b0;
        background: #ffffff;
      }

      footer-text p {
        padding: 10px;
        background-color: #333;
        border-radius: 5px;
        color: #e0e0e0;
      }

      .btn {
        background-color: #4a90e2;
        color: white;
        border: none;
        cursor: pointer;
        padding: 10px;
        width: 100%;
        border-radius: 5px;
      }

      footer-text {
        text-align: center;
        color: #b0b0b0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="form-container">
        <h1>Sign up</h1>
        <form action="#">
          <div class="input-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="newEmail"
              placeholder="Enter your email"
              required
            />
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="newPassword"
              placeholder="Enter your password"
              required
            />
          </div>
          <button onclick="signup()" type="submit" class="btn">Sign up</button>
          <p class="footer-text" id="up-response"></p>
        </form>
      </div>
    </div>
    <div class="container">
      <div class="form-container">
        <h1>Sign In</h1>
        <form action="#">
          <div class="input-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="Enter your email"
              required
            />
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="Enter your password"
              required
            />
          </div>
          <button onclick="signin()" type="submit" class="btn">Sign In</button>
          <p class="footer-text" id="in-response"></p>
        </form>
      </div>
    </div>
    <div class="container">
      <div class="form-container">
        <h1>Get Your Info</h1>
        <form action="#">
          <div class="input-group">
            <label for="email">Email</label>
            <p class="input" id="getEmail"></p>
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <p class="input" id="getPass"></p>
          </div>
          <button onclick="getinfo()" type="submit" class="btn">Get</button>
        </form>
      </div>
    </div>

    <script>
      let token = null;

      async function signup() {
        const email = document.getElementById("newEmail").value;
        const password = document.getElementById("newPassword").value;

        try {
          const response = await axios.post("http://localhost:3000/signup", {
            username: email,
            password: password,
          });

          document.getElementById("up-response").innerHTML =
            response.data.message;
        } catch (error) {
          // Display error message if status code is 400 or other non-2xx codes
          console.log(error.response);
          document.getElementById("up-response").innerHTML =
            error.response.data.message;
        }
      }

      async function signin() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const response = await axios.post("http://localhost:3000/signin", {
          username: email,
          password: password,
        });

        document.getElementById("in-response").innerHTML =
          response.data.message;
        token = response.data.token;
      }
      async function getinfo() {
        const response = await axios.get("http://localhost:3000/me", {
          headers: {
            token: token,
          },
        });

        document.getElementById("getEmail").innerText = response.data.username;
        document.getElementById("getPass").innerText = response.data.password;
        token = response.data.token;
      }
    </script>
  </body>
</html>
